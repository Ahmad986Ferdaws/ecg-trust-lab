name: CPU quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.15"
          python-version: "3.12"
      - name: Install CPU development environment
        run: |
          uv venv --python 3.12
          uv pip install --no-sources --torch-backend cpu -e . --group dev
          uv pip check
      - name: Verify CPU backend
        run: |
          uv run --no-sync python -c "import torch; assert torch.version.cuda is None; assert not torch.cuda.is_available(); print(torch.__version__)"
      - name: Tests
        id: tests
        run: >-
          uv run --no-sync pytest -q --basetemp=.pytest-tmp-cpu
          --junitxml="${{ runner.temp }}/cpu-tests-junit.xml"
          -o junit_logging=no -o junit_log_passing_tests=false
      - name: Summarize test results
        id: test_report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: >-
          uv run --no-sync python scripts/summarize_test_results.py
          --junit "${{ runner.temp }}/cpu-tests-junit.xml"
          --output-dir "${{ runner.temp }}/cpu-test-metadata"
          --summary "$GITHUB_STEP_SUMMARY"
          --test-outcome "${{ steps.tests.outcome }}"
      - name: Upload test outcome metadata
        if: ${{ !cancelled() && steps.test_report.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpu-test-metadata
          path: |
            ${{ runner.temp }}/cpu-test-metadata/test-metadata.json
            ${{ runner.temp }}/cpu-test-metadata/junit-metadata.xml
          if-no-files-found: error
          retention-days: 7
      - name: Ruff
        if: ${{ !cancelled() }}
        run: uv run --no-sync ruff check src tests scripts
      - name: Strict mypy (Windows scientific runtime target)
        if: ${{ !cancelled() }}
        run: uv run --no-sync mypy --platform win32
      - name: Confirm frozen dependency files are unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code -- pyproject.toml uv.lock
