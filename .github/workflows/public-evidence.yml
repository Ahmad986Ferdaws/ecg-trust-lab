name: Public evidence parity

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Compare presentation values and verify public artifact checksums
        run: node --experimental-strip-types --test results-experience/tests/evidence-parity.test.mjs
