    role: descriptive_unit_scale_smoke_check_only
    selection_cohort: primary_mapped
    selection_order: ecg_id_ascending
    selection_indices: numpy.linspace(0, n_minus_1, 256, dtype=int)
    selected_records: 256
    statistics: [absolute_median, absolute_p95, absolute_p99, absolute_maximum]
    rounded_reference_millivolts:
      absolute_median: 0.042047
      absolute_p95: 0.311201
      absolute_p99: 0.864611
      absolute_maximum: 58.506
    acceptance_bounds: none
    reject_finite_outliers: false
    clip: false
