    may_change_eligibility_or_preprocessing: false
    full_exact10_preinference_audit:
      evidence_role: descriptive_observed_evidence_only
      performance_outcomes_consulted: false
      records_expected: 18842
      records_checked: 18842
      records_passed_signal_contract: 18842
      raw_hdf5:
        dtype: float16
        shape: [12, 5000]
