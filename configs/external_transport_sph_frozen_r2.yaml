label_contract:
  source_column: AHA_Code
  statement_separator: ";"
  primary_modifier_separator: "+"
  token_type: exact_base10_integer
  primary_code_rule: exactly_one_non_modifier_integer_per_semicolon_statement
  non_modifier_code_rule: code_less_than_200_or_code_greater_than_or_equal_to_500
  modifier_code_rule: code_greater_than_or_equal_to_200_and_less_than_500
  plus_token_order_significance: none
  malformed_statement_rule: fail_if_not_exactly_one_non_modifier_integer
  duplicate_statement_rule: preserve_in_provenance_and_map_idempotently_by_set_membership
  direct_map:
    NORM:
      codes: [1]
      descriptions: [Normal ECG]
    MI:
      codes: [160, 161, 165, 166]
      descriptions: [Anterior MI, Inferior MI, Anteroseptal MI, Extensive anterior MI]
    STTC:
      codes: [145, 146, 147, 148]
      descriptions: [ST deviation, ST deviation with T-wave change, T-wave abnormality, Prolonged QT interval]
    CD:
      codes: [83, 84, 85, 86, 87, 88, 101, 102, 104, 105, 106, 108]
      descriptions:
        - Second-degree AV block, Mobitz type I (Wenckebach)
        - Second-degree AV block, Mobitz type II
        - 2:1 AV block
        - AV block, varying conduction
        - AV block, advanced (high-grade)
        - AV block, complete (third-degree)
        - Left anterior fascicular block
        - Left posterior fascicular block
        - Left bundle-branch block
        - Incomplete right bundle-branch block
        - Right bundle-branch block
        - Ventricular preexcitation
    HYP:
      codes: [140, 142, 143]
      descriptions: [Left atrial enlargement, Left ventricular hypertrophy, Right ventricular hypertrophy]
  ambiguous_unmapped_primary_codes:
    "80": Short PR interval
    "81": "AV conduction ratio N:D"
    "82": Prolonged PR interval
    "152": TU fusion
    "153": ST-T change due to ventricular hypertrophy
    "155": Early repolarization
  other_unmapped_rule: never_infer_a_target_from_an_unlisted_code
  cross_ontology_expert_review_performed: false
  adjudication_allowed_after_freeze: false

signal_contract:
  hdf5_dataset_key: ecg
  source_shape: [12, 5000]
  source_duration_seconds: 10
  source_unit: millivolts
