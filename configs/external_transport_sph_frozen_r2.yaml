  require_finite: true
  allow_transpose: false
  allow_lead_reordering: false
  allow_amplitude_rescaling: false
  resampling:
    method: scipy.signal.resample_poly
    up: 1
    down: 5
    axis: 1
    target_sampling_rate_hz: 100
    target_shape: [12, 1000]
    output_dtype: float32
    contiguous: true
  normalization:
    policy: apply_unchanged_after_resampling
    path: artifacts/preprocessing/ptbxl_v1.0.3_train_folds_1-7_normalization.json
    sha256: sha256:4a6cb489098361d8221403c14871c242672c346975af3a07f731ceac97264363
    refit_on_sph: false
    adapt_on_sph: false
  amplitude_qc:
