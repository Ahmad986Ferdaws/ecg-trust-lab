schema_version: 1
protocol_id: trust-sentinel-ood-completion-v1
status: frozen_pre_execution
frozen_at_utc: 2026-08-29T08:53:21Z
research_only: true

purpose: >-
  Complete the source-domain distribution-support component without changing
  trust-sentinel-source-calibration-v1 and without using any observed test,
  external, or future lockbox cohort for fitting or selection.

