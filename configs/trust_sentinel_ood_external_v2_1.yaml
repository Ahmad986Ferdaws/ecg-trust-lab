runtime:
  device: cuda:0
  model_mode: eval
  gradient_mode: inference_mode
  autocast: false
  tf32: false
  torch_compile: false
  deterministic_algorithms: true
  cudnn_benchmark: false
  batch_size: 128
  num_workers: 4
  shuffle: false
  drop_last: false
  full_embedding_passes_per_external_role: 2
  pass_semantics:
    stored_scientific_embedding_passes: exactly_two_first_and_repeated
    integrity_only_adapter_and_full_backbone_replays: >-
      May be repeated by staged, preterminal, and postpublication semantic
      verification under the same already-consumed claim. They must reproduce
      the stored scientific tensors exactly and may not create, replace,
      select, or publish another scientific output.
    integrity_replays_are_retries: false
    integrity_replays_create_new_claims: false
    zero_quality_pass_semantics: >-
      Store and verify canonical empty embedding, logit, probability, score,
