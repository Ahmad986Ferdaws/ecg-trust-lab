evaluation:
  primary_endpoints:
    challenge_group3_technical_block_sensitivity:
      numerator: selected_group3_records_with_quality_status_exactly_REACQUIRE
      denominator: all_selected_group3_records
      direction: higher_is_better
      minimum: 0.95
      resampling_unit: record
    challenge_group1_quality_pass_rate:
      numerator: group1_records_with_quality_status_PASS
      denominator: all_selected_group1_records
      direction: higher_is_better
      minimum: 0.90
      resampling_unit: record
    challenge_external_distribution_recall:
      numerator: quality_PASS_selected_records_with_score_strictly_above_v1_threshold
      denominator: all_quality_PASS_selected_records
      direction: higher_is_better
      minimum: 0.90
      resampling_unit: record
    zzu_external_distribution_recall:
      numerator: quality_PASS_selected_records_with_score_strictly_above_v1_threshold
      denominator: all_quality_PASS_selected_records
      direction: higher_is_better
      minimum: 0.90
      resampling_unit: patient_cluster
      replicate_statistic: record_weighted_recall
  multiplicity:
    family: exact_four_co_primary_endpoints
    family_wise_alpha: 0.05
    method: bonferroni
    one_sided_alpha_per_endpoint: 0.0125
    required_one_sided_confidence_level: 0.9875
    all_four_endpoints_must_pass: true
  bootstrap:
    resamples: 10000
    random_generator: numpy.random.Generator_PCG64
    quantile_method: linear
    lower_quantile_for_minimum_gates: 0.0125
    challenge:
      seed: 20260901
      unit: record
      record_order: ascending_official_record_stem_utf8
      draw_rule: draw_n_records_with_replacement
      generator_scope: reinitialize_PCG64_with_the_same_seed_for_each_endpoint
      exact_algorithm: >-
        numpy.random.Generator(numpy.random.PCG64(seed)).integers is used to
        draw n ordered record indices with replacement for every replicate;
        a binomial shortcut is forbidden even though its distribution matches.
    zzu:
      seed: 20260902
      unit: patient_cluster
      patient_order: ascending_canonical_dataset_scoped_patient_id
      record_order_within_patient: ascending_official_record_identity_utf8
      draw_rule: draw_n_patients_with_replacement_and_include_all_patient_records
    nonfinite_empty_or_undefined_replicate_policy: fail_closed
  hard_gates:
    challenge_reference_label_alignment_complete: true
    challenge_invalid_input_count: 0
    challenge_quality_pass_records_minimum: 1
    zzu_invalid_input_count: 0
    zzu_quality_pass_record_coverage_minimum: 0.80
    zzu_quality_pass_patient_coverage_minimum: 0.80
    challenge_group3_prediction_allowed_count: 0
    skipped_selected_records: 0
    target_site_fitting_performed: false
    v1_policy_bytes_unchanged_before_and_after: true
    exact_v1_whole_bundle_verifier_passes: true
    external_raw_source_sizes_sha256_and_expected_md5_verified_before_and_after: true
    exact_dataset_roots_verified: true
    exact_selected_input_inventory_verified_before_and_after: true
    exact_quality_labels_patient_roles_and_all_and_only_selection_rederived: true
    raw_and_canonical_lead_and_data_file_bindings_verified: true
    active_scientific_package_versions_match_child: true
    deterministic_repeated_embeddings_match: true
    raw_source_to_canonical_signal_replay_matches: true
    canonical_signal_to_full_backbone_embedding_replay_matches: true
    aggregate_only_publication_verified: true
  secondary_report_only: []
  secondary_report_rationale: >-
    No post-hoc exploratory subgroup summaries are preregistered. Public output
    is limited to the four co-primary endpoints, deterministic hard-gate
    aggregates, and exact five-state route counts; the two-record Challenge
    indeterminate group is not separately published.
  final_route_counts:
    exact_order: [INVALID_INPUT, REACQUIRE, UNSUPPORTED_INPUT, ABSTAIN, PREDICTION_ALLOWED]
    include_explicit_zero_counts: true
    rederived_from_private_rows_by_terminal_verifier: true
  unsupported_metrics:
    ood_auroc: NOT_EVALUATED_NO_EXTERNAL_IN_DISTRIBUTION_CONTROL
    ood_average_precision: NOT_EVALUATED_NO_EXTERNAL_IN_DISTRIBUTION_CONTROL
    unknown_disease_recall: NOT_EVALUATED
    diagnostic_performance: NOT_EVALUATED

