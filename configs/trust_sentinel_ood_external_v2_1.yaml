eligibility:
  external_evidence_eligible_when:
    - all_four_multiplicity_adjusted_primary_gates_pass
    - every_hard_gate_passes
    - immutable_success_bundle_verifies
    - no_failure_receipt_exists
  complete_but_failed_status: EXTERNAL_OOD_TARGET_MISSED
  insufficient_status: EXTERNAL_OOD_INSUFFICIENT_EVIDENCE
  success_status: EXTERNAL_OOD_EVIDENCE_COMPLETE
  unfavorable_result_is_completed_evidence: true
  insufficient_result_semantics: >-
    A valid completed run with an empty preregistered endpoint denominator
    omits only that undefined endpoint and its bootstrap array, yields
    EXTERNAL_OOD_INSUFFICIENT_EVIDENCE, and is retained in a terminally
    verified immutable bundle. Undefined 0/0 is never coerced to a target miss
    or success. Input, hash, runtime, code-integrity, or implementation errors
    instead produce a postclaim failure receipt and forbid a success manifest.
  insufficient_result_is_completed_bundle_when_integrity_remains_verified: true
  system_integration:
    automatic: false
    require_external_evidence_eligible: true
    require_separate_source_support_evidence_eligible: true
    current_v1_source_support_evidence_eligible: false
    current_consequence: >-
      This protocol cannot by itself authorize Sentinel integration even if all
      external endpoints pass. A distinct future source-retention protocol,
      without reusing C, must first produce eligible evidence.

