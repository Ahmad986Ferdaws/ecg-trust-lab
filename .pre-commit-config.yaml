# Optional local hooks that mirror the CPU quality workflow before a push.
# Install once with `uvx pre-commit install`. The ruff and mypy hooks run the
# project's own environment (`uv run --no-sync`) so they use the same tool
# versions as CI; create that environment first as described in CONTRIBUTING.md.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
        # This test asserts that a PEM header string is redacted; it holds no key.
        exclude: ^tests/unit/test_model_passport\.py$
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: ruff
        name: ruff (project environment)
        entry: uv run --no-sync ruff check
        language: system
        types: [python]
        files: ^(src|tests|scripts)/
      - id: mypy
        name: mypy --platform win32 (project environment)
        entry: uv run --no-sync mypy --platform win32
        language: system
        pass_filenames: false
        files: ^src/.*\.py$
