# Optional local hooks that mirror the CPU quality workflow before a push.
# The ruff and mypy hooks always run on the whole tree, exactly like CI, so
# configuration-only edits and file deletions are checked too.
# Install once with `uvx pre-commit install`. The ruff and mypy hooks run the
# project's own environment (`uv run --no-sync`) so they use the same tool
# versions as CI; create that environment first as described in CONTRIBUTING.md.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: ruff
        name: ruff check src tests scripts (project environment)
        entry: uv run --no-sync ruff check src tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy --platform win32 (project environment)
        entry: uv run --no-sync mypy --platform win32
        language: system
        pass_filenames: false
        always_run: true
