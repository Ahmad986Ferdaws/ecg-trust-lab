[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecg-trust"
version = "0.1.0"
description = "Trustworthy multi-label 12-lead ECG classification on PTB-XL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "PTB-XL ECG Research Project" }]
dependencies = [
  "captum>=0.8.0",
  "fastapi>=0.141.1",
  "filelock>=3.32",
  "h5py>=3.15",
  "jinja2>=3.1.6",
  "matplotlib>=3.10",
  "numpy>=2.0",
  "optuna>=4.5",
  "pandas>=2.3",
  "plotly>=6.9.0",
  "psutil>=7.0",
  "pyarrow>=20.0",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0",
  "rich>=14.0",
  "scikit-learn>=1.7",
  "scipy>=1.16",
  "seaborn>=0.13",
  "tensorboard>=2.20",
  "torch>=2.12,<2.14",
  "tqdm>=4.67",
  "typer>=0.16",
  "uvicorn[standard]>=0.52.1",
  "wfdb>=4.3",
]

[project.scripts]
ecg-verify = "ecg_trust.system_check:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_trust"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".python", ".uv-cache", ".venv", "artifacts", "data", "outputs", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ecg_trust"]
mypy_path = ["src", "."]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
